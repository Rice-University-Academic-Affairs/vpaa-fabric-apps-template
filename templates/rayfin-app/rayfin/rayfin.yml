id: {{slug}}
name: {{slug}}
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    allowedRedirectUris:
    - http://localhost:5173
    - http://127.0.0.1:5173
  data:
    enabled: true
    dialect: mssql
    allowIntrospection: false
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: build
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  functions:
    enabled: false
